# Settings for the hosted build. The Dockerfile sets SPRING_PROFILES_ACTIVE=prod,
# so Spring loads application.properties first and then overrides it with this
# file. Anything not repeated here keeps its value from application.properties.
#
# Nothing secret belongs in this file. DB_URL, DB_USERNAME, DB_PASSWORD and
# JWT_SECRET are read from the environment by application.properties and are
# set in the hosting platform, never committed.

# SQL is echoed in a readable block during development so we can see what
# Hibernate generated. In production that fills the log with noise and can put
# query values - including a student's location - into a log we do not control.
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Hibernate still creates and adds columns, because the schema is driven by the
# entities and there is no migration tool in this project. It never drops
# anything, so an existing table keeps its rows across a deploy.
spring.jpa.hibernate.ddl-auto=update

# A stack trace on an error page tells a stranger which framework, which
# version and which classes are running. Errors the app raises deliberately
# still return the standard shape from ApiException; this only affects the
# fallback page for everything else.
server.error.include-stacktrace=never
server.error.include-message=never

# The platform terminates TLS in front of us and forwards the original scheme
# and host in X-Forwarded-* headers. Without this Spring builds redirect URLs
# from the container's own view of the world and sends people to http://
# on an internal hostname.
server.forward-headers-strategy=framework

# Enough to see requests and failures, without a line per SQL statement.
logging.level.root=INFO
logging.level.za.ac.ufh.safety=INFO
logging.level.org.hibernate.SQL=WARN

# No health-check settings here on purpose. A dedicated /actuator/health would
# need spring-boot-starter-actuator, which is a new dependency and not worth
# adding for this. Point the platform's health check at / instead: it serves
# the landing page, needs no token, and only answers once the application has
# finished starting - which is the question a health check is asking.
