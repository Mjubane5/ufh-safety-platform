spring.application.name=ufh-safety-backend
# Railway, Render and most PaaS hosts assign a port at runtime and expect the
# app to listen on it. Falls back to 8080 for local development.
server.port=${PORT:8080}

# MySQL connection. Change DB_PASSWORD to your own MySQL root password.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ufh_safety_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# During development JPA creates/updates the users table automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# No default on purpose. A signing key committed here would let anyone with
# repository access mint a token for any registered account, so the backend
# refuses to start until JWT_SECRET is set. See README-BACKEND.md.
# Minimum 32 characters for HS256.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120

# Two-step student login (SendGridEmailService) - sends the sign-in code.
# Unlike JWT_SECRET this is allowed to be unset: the backend still starts,
# and the code is written to the server log instead of emailed, so the team
# can keep testing the login flow on a machine with no SendGrid account. Set
# both before deploying anywhere a real student will use this - see
# README-BACKEND.md for how to get a SendGrid API key.
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:UFH Safety Platform}

# Safe Walk routing (CppRouteEngine) - the compiled algorithms/shortest_path
# binary and the campus graph it loads. Both unset by default: a teammate
# with no C++ toolchain still gets a working Safe Walk route, just the
# straight-line GeometricRouteEngine fallback instead of a real road-
# following one - see CppRouteEngine's class comment. The Dockerfile
# compiles the binary and sets both of these for the deployed app.
app.routing.cpp-binary=${ROUTING_CPP_BINARY:}
app.routing.graph-file=${ROUTING_GRAPH_FILE:}
