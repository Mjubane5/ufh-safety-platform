spring.application.name=ufh-safety-backend
# Railway, Render and most PaaS hosts assign a port at runtime and expect the
# app to listen on it. Falls back to 8080 for local development.
server.port=${PORT:8080}

# MySQL connection. Change DB_PASSWORD to your own MySQL root password.
spring.datasource.url=jdbc:h2:mem:ufh_safety_platform;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# During development JPA creates/updates the users table automatically.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# No default on purpose. A signing key committed here would let anyone with
# repository access mint a token for any registered account, so the backend
# refuses to start until JWT_SECRET is set. See README-BACKEND.md.
# Minimum 32 characters for HS256.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120
