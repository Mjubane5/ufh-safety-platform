spring.application.name=ufh-safety-backend
server.port=8080

# MySQL connection. Change DB_PASSWORD to your own MySQL root password.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ufh_safety_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# During development JPA creates/updates the users table automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Replace this before deployment. Minimum 32 characters for HS256.
app.jwt.secret=${JWT_SECRET:UFH-Safety-Platform-Development-Secret-Change-Me-2026}
app.jwt.expiration-minutes=120
