<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident — UFH Safety Platform</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="./dashboard.html">
        <span class="brand-mark" aria-hidden="true">UFH</span>
        <span class="brand-text">
          <span class="brand-name">Fort Hare Safety</span>
          <span class="brand-sub">Campus emergency &amp; wellness</span>
        </span>
      </a>

      <button class="btn btn-ghost" id="signout-button" type="button">Sign out</button>
    </div>
  </header>

  <main class="page">
    <p class="notice">
      Prototype for CSC 200 / CSC 300. Not connected to any live emergency
      service. All data shown here is synthetic.
    </p>

    <p><a class="btn btn-ghost" id="incident-back-link" href="./dashboard.html">&larr; Back to your reports</a></p>

    <div id="banner-slot"></div>

    <h1 id="incident-heading">Incident</h1>

    <!-- Live navigation map when responder is dispatched -->
    <div id="incident-live-tracking" aria-live="polite"></div>

    <section id="incident-detail" aria-live="polite" aria-busy="true"></section>

    <section id="cancel-slot" hidden></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/demo-notice.js"></script>
  <script type="module" src="./js/shell.js"></script>
  <script type="module" src="./js/incident.js"></script>
</body>
</html>
